<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)">
<title>__TITLE__</title>
<style>
:root{
  --bg:#F4F1EA;--surface:#FFFDF9;--ink:#1D1B18;--ink2:#6B665E;--ink3:#A8A298;--line:#E4DED2;--track:#EAE5DB;
  --acc:#C8553D;--acc-soft:#F5E1D9;--acc-ink:#A8402B;
  --sh1:0 1px 2px rgba(40,30,20,.06),0 4px 14px rgba(40,30,20,.06);
  --sh2:0 18px 50px rgba(40,30,20,.18),0 3px 10px rgba(40,30,20,.08);
  --ease:cubic-bezier(.22,.8,.24,1);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141312;--surface:#1F1D1B;--ink:#F3EFE8;--ink2:#ABA59B;--ink3:#6F6A61;--line:#2E2B27;--track:#26231F;
  --acc:#EC8A6B;--acc-soft:#3A2620;--acc-ink:#F2A188;
  --sh1:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);--sh2:0 18px 50px rgba(0,0,0,.55);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Segoe UI","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block;flex:none}

.app{height:100dvh;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr) auto}
.col{max-width:620px;width:100%;margin:0 auto;padding:0 20px}

/* 顶部 */
.top{padding-top:calc(14px + env(safe-area-inset-top))}
.top .col{display:flex;align-items:flex-start;gap:12px}
.meta{flex:1;min-width:0}
.kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl{font-size:19px;font-weight:750;letter-spacing:-.015em;line-height:1.25;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{font-weight:400;color:var(--ink3);margin-left:6px;font-size:15px}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--sh1);color:var(--ink2);flex:none}

/* 段落 + 步骤 */
.nav{padding-top:14px}
.row1{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.segchip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px 7px 14px;border-radius:999px;background:var(--surface);box-shadow:var(--sh1);font-size:14px;font-weight:650}
.segchip em{font-style:normal;font-weight:400;color:var(--ink3)}
.segmeta{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.steps{display:grid;grid-template-columns:repeat(4,1fr);background:var(--track);border-radius:14px;padding:3px;position:relative}
.steps .pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/4);border-radius:11px;background:var(--surface);box-shadow:var(--sh1);transition:transform .35s var(--ease)}
.steps button{position:relative;z-index:1;height:36px;border-radius:11px;font-size:13.5px;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:5px;transition:color .2s}
.steps button.on{color:var(--ink);font-weight:650}
.steps button .ck{width:15px;height:15px;border-radius:50%;background:var(--acc);color:#fff;display:none;place-items:center}
.steps button.done .ck{display:grid}
.steps button .no{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.steps button.done .no{display:none}

/* 舞台：歌词式 */
.stage{position:relative;overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 12%,#000 82%,transparent 100%);
          mask-image:linear-gradient(to bottom,transparent 0,#000 12%,#000 82%,transparent 100%)}
.hint{text-align:center;font-size:12.5px;color:var(--ink3);margin:12px 0 0}
.lyrics{position:absolute;left:20px;right:20px;top:0;transition:transform .55s var(--ease);will-change:transform}
.ln{padding:9px 0;cursor:pointer;transition:opacity .35s,filter .35s}
.ln .s{margin:0;font-size:19px;line-height:1.42;font-weight:600;letter-spacing:-.012em;color:var(--ink);opacity:.26;transition:opacity .3s}
.ln .t{display:none;margin:10px 0 0;font-size:15.5px;line-height:1.6;color:var(--ink2)}
.ln.cur{padding:14px 0}
.ln.cur .s{opacity:1;font-size:29px;line-height:1.3;font-weight:700;letter-spacing:-.022em}
.ln.cur.m .s{font-size:24px;line-height:1.34}
.ln.cur.l .s{font-size:20px;line-height:1.42}
.ln.cur.xl .s{font-size:17.5px;line-height:1.5;font-weight:650}
.ln.cur .t{display:block}
.ln .num{display:none}
.ln.cur .num{display:block;font-size:11.5px;color:var(--ink3);font-weight:600;letter-spacing:.06em;margin-bottom:8px;font-variant-numeric:tabular-nums}
.wd{transition:opacity .18s}
.kara .ln.cur .wd{opacity:.32}
.kara .ln.cur .wd.on{opacity:1}
.nt{text-decoration:underline;text-decoration-color:var(--acc);text-decoration-thickness:2px;text-underline-offset:4px}
.ln.cur .nt{color:var(--acc-ink);cursor:pointer}
/* 遮挡 */
.hide .lyrics{opacity:0;pointer-events:none}
.lyrics{transition:transform .55s var(--ease),opacity .4s}
.drill .ln:not(.rs) .s{filter:blur(9px);user-select:none}
.drill .ln:not(.rt) .t{filter:blur(8px);user-select:none}
.drill .ln.cur:not(.rs) .s{opacity:.55}
.ln .s,.ln .t{transition:filter .35s,opacity .3s}
.acts{display:none;gap:8px;margin-top:16px;flex-wrap:wrap}
.drill .ln.cur .acts{display:flex}
.act{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:var(--surface);box-shadow:var(--sh1);font-size:13.5px;font-weight:600;color:var(--ink)}
.act.pri{background:var(--ink);color:var(--bg)}
.act.on{color:var(--acc-ink);background:var(--acc-soft);box-shadow:none}
/* 盲听罩层 */
.veil{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:3;pointer-events:none}
.hide .veil{display:flex}
.orb{width:92px;height:92px;border-radius:50%;background:var(--surface);box-shadow:var(--sh2);display:grid;place-items:center;color:var(--acc);position:relative}
.orb::before,.orb::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--acc);opacity:0}
.playing .orb::before{animation:ring 2.2s var(--ease) infinite}
.playing .orb::after{animation:ring 2.2s var(--ease) 1.1s infinite}
@keyframes ring{0%{transform:scale(1);opacity:.45}100%{transform:scale(1.9);opacity:0}}
.veil b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.veil small{font-size:13px;color:var(--ink2);margin-top:-12px}

/* 底部 */
.dock{padding:6px 0 calc(16px + env(safe-area-inset-bottom))}
.ticks{display:flex;gap:2px;height:22px;align-items:center;cursor:pointer}
.tk{height:5px;border-radius:3px;background:var(--line);position:relative;overflow:hidden;transition:height .2s,background .2s;min-width:2px}
.tk.past{background:var(--ink3)}
.tk.cur{height:9px;background:var(--acc-soft)}
.tk.cur i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);width:0}
.ticks:hover .tk{height:8px}.ticks:hover .tk.cur{height:11px}
.times{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;margin-top:2px}
.ctl{display:grid;grid-template-columns:1fr auto auto auto 1fr;align-items:center;gap:22px;margin-top:8px}
.speed{justify-self:start;height:34px;min-width:50px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink2);background:var(--track);font-variant-numeric:tabular-nums}
.skip{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.skip:active{background:var(--track)}
.play{width:66px;height:66px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:0 10px 24px rgba(30,25,20,.22);transition:transform .12s}
.play:active{transform:scale(.94)}
.loop{justify-self:end;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink3);transition:.2s}
.loop.on{color:var(--acc-ink);background:var(--acc-soft)}
.warn{display:none;margin:10px 20px 0;padding:10px 14px;border-radius:12px;background:#FBE4E0;color:#8E2A1B;font-size:13.5px}

/* 侧栏：全文 / 难点 */
.side{position:fixed;inset:0;z-index:20;background:var(--bg);transform:translateY(100%);transition:transform .45s var(--ease);display:flex;flex-direction:column}
.side.open{transform:none}
.side-h{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 20px 12px}
.tabs{flex:1;display:inline-grid;grid-template-columns:1fr 1fr;background:var(--track);border-radius:12px;padding:3px;max-width:280px}
.tabs button{height:32px;border-radius:9px;font-size:13.5px;color:var(--ink2)}
.tabs button.on{background:var(--surface);color:var(--ink);font-weight:650;box-shadow:var(--sh1)}
.side-b{flex:1;overflow:auto;padding:4px 12px calc(30px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.it{display:grid;grid-template-columns:28px 1fr;gap:4px;padding:11px 10px;border-radius:14px;cursor:pointer}
.it:hover{background:rgba(127,110,90,.07)}
.it.cur{background:var(--surface);box-shadow:var(--sh1)}
.it .n{font-size:11.5px;color:var(--ink3);padding-top:3px;font-variant-numeric:tabular-nums}
.it .s{font-size:15.5px;line-height:1.5;font-weight:500}
.it .t{font-size:13.5px;color:var(--ink2);margin-top:3px;line-height:1.55}
.side.hide .it .s,.side.hide .it .t{filter:blur(6px)}
.side.drill .it:not(.rs) .s{filter:blur(6px)}
.side.drill .it:not(.rt) .t{display:none}
.gh{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--ink3);padding:16px 10px 6px;text-transform:uppercase}
.nc{padding:14px 12px;border-radius:14px;cursor:pointer}
.nc:hover{background:rgba(127,110,90,.07)}
.nc .h{display:flex;align-items:baseline;gap:8px}
.nc .e{font-weight:700;font-size:16px;letter-spacing:-.01em}
.tag{font-size:11px;font-weight:600;color:var(--acc-ink);background:var(--acc-soft);padding:2px 7px;border-radius:6px;white-space:nowrap}
.nc .w{font-size:11.5px;color:var(--ink3);margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
.nc .x{font-size:14px;color:var(--ink2);margin-top:4px;line-height:1.55}
.empty{color:var(--ink3);font-size:14px;padding:30px 10px;text-align:center}

/* 底部面板 */
.scrim{position:fixed;inset:0;background:rgba(20,16,12,.32);opacity:0;pointer-events:none;transition:opacity .3s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:560px;margin:0 auto;background:var(--surface);border-radius:26px 26px 0 0;box-shadow:var(--sh2);
  padding:10px 22px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .42s var(--ease);max-height:82dvh;overflow:auto}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px}
.sheet h3{margin:0;font-size:20px;letter-spacing:-.015em}
.sheet .sub{color:var(--ink2);font-size:14px;margin-top:4px}
.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:20px 0 4px}
.opt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 0 12px;border-radius:16px;background:var(--bg);transition:.15s}
.opt b{font-size:17px;font-variant-numeric:tabular-nums}
.opt span{font-size:11.5px;color:var(--ink3)}
.opt:hover,.opt:active{background:var(--acc-soft)}
.opt:hover b{color:var(--acc-ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:700;font-size:15.5px;margin-top:20px}
.btn.ghost{background:var(--track);color:var(--ink);margin-top:10px}
.cmp{margin-top:22px;display:grid;gap:14px}
.cmp .r{display:grid;grid-template-columns:52px 1fr 48px;align-items:center;gap:12px;font-size:13px;color:var(--ink2)}
.cmp .bar{height:12px;border-radius:6px;background:var(--track);overflow:hidden}
.cmp .bar i{display:block;height:100%;border-radius:6px;background:var(--ink3);width:0;transition:width .9s var(--ease)}
.cmp .r.b .bar i{background:var(--acc)}
.cmp .r b{color:var(--ink);font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.big{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.big b{font-size:40px;letter-spacing:-.03em;line-height:1}
.delta{font-size:13px;font-weight:700;color:var(--acc-ink);background:var(--acc-soft);padding:3px 9px;border-radius:999px}
.seglist{margin-top:14px;display:grid;gap:4px}
.sg{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:12px 12px;border-radius:14px;text-align:left}
.sg:hover{background:var(--bg)}
.sg.cur{background:var(--acc-soft)}
.sg .k{font-weight:700;font-size:15px;min-width:52px}
.sg .tm{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--acc)}
.note-e{font-size:26px;font-weight:750;letter-spacing:-.02em;margin:6px 0 8px}
.note-x{font-size:15.5px;line-height:1.65;color:var(--ink)}
.quote{margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--bg);font-size:14px;line-height:1.55;color:var(--ink2)}
.quote small{display:block;color:var(--ink3);font-size:11.5px;margin-bottom:4px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;z-index:40;transition:.3s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
kbd{font:600 10.5px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--ink2)}
.keys{display:none;text-align:center;font-size:11.5px;color:var(--ink3);margin-top:10px}

/* 桌面：左舞台 + 右侧栏常驻 */
@media (min-width:1000px){
  .app{grid-template-columns:minmax(0,1fr) 400px;column-gap:28px;padding:0 28px}
  .top,.nav,.stage,.dock,.warnbox{grid-column:1}
  .side{position:relative;inset:auto;transform:none;grid-column:2;grid-row:1/6;background:transparent;border-left:1px solid var(--line);margin:24px 0}
  .side-h{padding:4px 16px 12px}
  #bClose,#bList{display:none}
  .ln .s{font-size:21px}.ln.cur .s{font-size:36px}.ln.cur.m .s{font-size:29px}.ln.cur.l .s{font-size:23px}.ln.cur.xl .s{font-size:19px}
  .ln .t{font-size:17px}
  .keys{display:block}
}
@media (max-width:370px){.ctl{gap:12px}.ln.cur .s{font-size:25px}.steps button{font-size:12.5px}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top"><div class="col">
    <div class="meta"><div class="kicker" id="kicker"></div><div class="ttl" id="ttl"></div></div>
    <button class="round" id="bList" aria-label="transcript"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
  </div></header>
  <div class="warnbox"><div class="warn" id="warn"></div></div>
  <nav class="nav"><div class="col">
    <div class="row1">
      <button class="segchip" id="bSeg"><span id="segName"></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <span class="segmeta" id="segMeta"></span>
    </div>
    <div class="steps" id="steps"><span class="pill" id="pill"></span></div>
    <div class="hint" id="hint"></div>
  </div></nav>
  <main class="stage" id="stage">
    <div class="col" style="position:relative;height:100%"><div class="lyrics" id="ly"></div></div>
    <div class="veil" id="veil">
      <div class="orb"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><path d="M21 15a2 2 0 0 1-2 2h-1v-6h1a2 2 0 0 1 2 2z"/><path d="M3 15a2 2 0 0 0 2 2h1v-6H5a2 2 0 0 0-2 2z"/></svg></div>
      <b id="veilT"></b><small id="veilS"></small>
    </div>
  </main>
  <footer class="dock"><div class="col">
    <div class="ticks" id="ticks"></div>
    <div class="times"><span id="tNow">0:00</span><span id="tEnd">0:00</span></div>
    <div class="ctl">
      <button class="speed" id="bSpeed" aria-label="speed">1×</button>
      <button class="skip" id="bPrev" aria-label="previous line"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="4.6" y="5" width="2.5" height="14" rx="1.25"/><path d="M19.6 6.4v11.2a1.1 1.1 0 0 1-1.7.92l-8.5-5.6a1.1 1.1 0 0 1 0-1.84l8.5-5.6a1.1 1.1 0 0 1 1.7.92z"/></svg></button>
      <button class="play" id="bPlay" aria-label="play"></button>
      <button class="skip" id="bNext" aria-label="next line"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="16.9" y="5" width="2.5" height="14" rx="1.25"/><path d="M4.4 6.4v11.2a1.1 1.1 0 0 0 1.7.92l8.5-5.6a1.1 1.1 0 0 0 0-1.84l-8.5-5.6a1.1 1.1 0 0 0-1.7.92z"/></svg></button>
      <button class="loop" id="bLoop" aria-label="loop"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.5l3.5 3.5L17 9.5"/><path d="M3.5 11V9.5A3.5 3.5 0 0 1 7 6h13.5"/><path d="M7 21.5L3.5 18 7 14.5"/><path d="M20.5 13v1.5A3.5 3.5 0 0 1 17 18H3.5"/><path d="M11 10.2l1.4-.8v5.4"/></svg></button>
    </div>
    <div class="keys" id="keys"></div>
  </div></footer>
  <aside class="side" id="side">
    <div class="side-h">
      <div class="tabs"><button id="tabS" class="on"></button><button id="tabN"></button></div>
      <button class="round" id="bClose" aria-label="close" style="margin-left:auto"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="side-b" id="sideB"></div>
  </aside>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<audio id="au" preload="auto"></audio>
<script type="application/json" id="data">__DATA__</script>
<script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById("data").textContent);
var S=D.sentences,G=D.segments,N=D.notes||[];
var UI=(D.target_lang||"zh").indexOf("zh")===0?"zh":"en";
var L={zh:{
  seg:"第 {n} 段",steps:["盲听","精听","对照","再盲听"],
  hints:["第 1 步 · 完整听一遍，先别看文字","第 2 步 · 一句一句磨，听不懂再看","第 3 步 · 对照原文和译文，弄懂每一句","第 4 步 · 合上文字，再完整听一遍"],

// 把一句切成词 span，并标出难点表达
function tokens(s){
  var text=s.s,low=text.toLowerCase(),marks=[];
  (notesBy[s.n]||[]).forEach(function(x){var i=low.indexOf(x.expr.toLowerCase());if(i>=0)marks.push([i,i+x.expr.length,x.k]);});
  var re=/\S+/g,m,pos=0,wi=0,out="",open=null;
  while((m=re.exec(text))){
    var a=m.index,b=a+m[0].length,sp=text.slice(pos,a);
    if(open&&a>=open[1]){out+="</span>";open=null;}
    out+=esc(sp);
    if(!open){for(var q=0;q<marks.length;q++){if(a<marks[q][1]&&b>marks[q][0]){open=marks[q];out+='<span class="nt" data-k="'+open[2]+'">';break;}}}
    out+='<span class="wd" data-w="'+(wi++)+'">'+esc(m[0])+'</span>';
    pos=b;
  }
  if(open)out+="</span>";
  return out+esc(text.slice(pos));
}

function sizeCls(s){var n=s.s.length;return n>260?"xl":n>150?"l":n>80?"m":"";}

    h+='<div class="ln '+sizeCls(s)+'" data-i="'+i+'"><div class="num">'+f(L.line,{n:s.n})+' · '+mmss(s.a)+'</div><p class="s">'+tokens(s)+'</p>'+
      (s.t?'<p class="t">'+esc(s.t)+'</p>':'')+
      '<div class="acts"><button class="act" data-a="again">'+I.replay+L.again+'</button><button class="act" data-a="src">'+I.eye+'<span></span></button><button class="act pri" data-a="next">'+L.next+I.arrow+'</button></div></div>';}
  $("ly").innerHTML=h;

  applyLineState();
}
function onLineClick(e){
  var el=e.currentTarget,i=+el.dataset.i,s=S[i];
  var act=e.target.closest(".act");
  if(act){e.stopPropagation();var a=act.dataset.a;
    if(a==="again")playSentence(i);
    else if(a==="next")next();
    else if(a==="src"){if(!revS[s.n])revS[s.n]=true;else revT[s.n]=!revT[s.n];applyLineState();renderSide();}
    return;}
  var nt=e.target.closest(".nt");
  if(nt&&st.step===2&&i===st.cur){openNote(+nt.dataset.k);return;}
  if(st.step===1&&i===st.cur&&!revS[s.n]){revS[s.n]=true;applyLineState();renderSide();return;}

function applyLineState(){
  var stage=$("stage");

  $("ly").querySelectorAll(".ln").forEach(function(el){
    var i=+el.dataset.i,s=S[i],cur=i===st.cur;
    el.classList.toggle("cur",cur);
    el.classList.toggle("rs",st.step===2||!!revS[s.n]);
    el.classList.toggle("rt",st.step===2||!!revT[s.n]);
    if(cur){var b=el.querySelector('[data-a="src"]');if(b){var shown=!!revS[s.n];
      b.querySelector("span").textContent=shown?L.showTgt:L.showSrc;b.classList.toggle("on",shown&&!!revT[s.n]);}}

function center(){

function openSheet(html,bind){var sh=$("sheet");sh.innerHTML='<div class="grab"></div>'+html;$("scrim").classList.add("on");sh.classList.add("on");if(bind)bind(sh);}

    var g=G[st.seg],rt=st.ratings[g.n]||{};rt[which]=+b.dataset.v;st.ratings[g.n]=rt;markStep(which==="r1"?1:4);save();renderSteps();

function showR1(){

    '<div class="cmp"><div class="r"><span>'+L.first+'</span><div class="bar"><i data-w="'+(a||0)+'"></i></div><b>'+(a!=null?a+"%":"—")+'</b></div>'+

    '<div class="quote"><small>'+f(L.line,{n:s.n})+' · '+mmss(s.a)+'</small>'+esc(s.s)+(s.t?'<div style="margin-top:6px">'+esc(s.t)+'</div>':'')+'</div>'+

// ---------- 播放逻辑 ----------
function markStep(k){var n=G[st.seg].n;st.steps[n]=Math.max(st.steps[n]||0,k);}
function setStep(k,auto){
  st.step=k;loop=false;save();
  renderTop();renderSteps();applyLineState();renderSide();renderCtl();
  if(auto&&(k===0||k===3)){au.pause();playSentence(G[st.seg].from);}
}
function goSeg(k,i){
  k=Math.max(0,Math.min(G.length-1,k));au.pause();
  st.seg=k;st.cur=i!=null?i:G[k].from;st.step=i!=null?st.step:0;revS={};revT={};save();
  renderTop();renderSteps();renderStage();renderTicks();renderSide();renderTime();renderCtl();
  if(i==null)au.currentTime=S[st.cur].a;
}
function setCur(i){st.cur=i;save();applyLineState();updateTicks();renderSide();}
function playSentence(i){
  i=Math.max(0,Math.min(S.length-1,i));
  if(segOf(i)!==st.seg)goSeg(segOf(i),i);
  setCur(i);au.currentTime=S[i].a;au.playbackRate=st.speed;
  var p=au.play();if(p&&p.catch)p.catch(function(){});
}
function onSegmentEnd(){
  au.pause();
  if(st.step===0)openRate("r1");else if(st.step===3)openRate("r4");else if(st.step===2){markStep(3);save();renderSteps();}
}
function tick(){
  var t=au.currentTime,s=S[st.cur];
  if(t<s.a-0.6||t>s.b+0.6){var j=findIdx(t);if(j!==st.cur){if(segOf(j)!==st.seg)goSeg(segOf(j),j);setCur(j);}}
  else if(t>=s.b-0.03){
    var g=G[st.seg];
    if(loop){au.currentTime=s.a;lastWord=-1;}
    else if(st.step===1){au.pause();au.currentTime=Math.max(s.a,s.b-0.05);if((st.steps[g.n]||0)<2){markStep(2);save();renderSteps();}}
    else if(st.cur+1>=g.to){onSegmentEnd();}
    else setCur(st.cur+1);
  }
  markWords(false);renderTime();
  if(!au.paused)raf=requestAnimationFrame(tick);
}
au.addEventListener("play",function(){cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);renderCtl();});
au.addEventListener("pause",function(){renderCtl();markWords(true);});
function togglePlay(){
  if(!au.paused){au.pause();return;}
  var s=S[st.cur],t=au.currentTime;
  if(t<s.a-0.05||t>=s.b-0.08)au.currentTime=s.a;
  au.playbackRate=st.speed;var p=au.play();if(p&&p.catch)p.catch(function(){});
}
function next(){var g=G[st.seg];if(st.cur+1>=g.to&&st.step===1){markStep(2);save();renderSteps();}playSentence(st.cur+1);}
function prev(){playSentence(st.cur-1);}

$("bPlay").onclick=togglePlay;$("bNext").onclick=next;$("bPrev").onclick=prev;
$("bLoop").onclick=function(){loop=!loop;renderCtl();toast(loop?L.loopOn:L.loopOff);};
$("bSpeed").onclick=function(){var v=[0.75,0.9,1,1.25];st.speed=v[(v.indexOf(st.speed)+1)%v.length];au.playbackRate=st.speed;save();renderCtl();};
$("bSeg").onclick=openSegs;$("bList").onclick=openSide;$("bClose").onclick=closeSide;
$("tabS").onclick=function(){tab="s";renderSide();};$("tabN").onclick=function(){tab="n";renderSide();};
$("ticks").onclick=function(e){var tk=e.target.closest(".tk");if(tk)playSentence(+tk.dataset.i);};
$("keys").innerHTML=L.keys;
addEventListener("resize",center);
document.addEventListener("keydown",function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="Escape"){closeSheet();closeSide();return;}
  if(e.key===" "){e.preventDefault();togglePlay();}
  else if(e.key==="ArrowRight"){e.preventDefault();next();}
  else if(e.key==="ArrowLeft"){e.preventDefault();prev();}
  else if(e.key==="r"||e.key==="R"){loop=!loop;renderCtl();toast(loop?L.loopOn:L.loopOff);}
  else if((e.key==="t"||e.key==="T")&&st.step===1){var n=S[st.cur].n;if(!revS[n])revS[n]=true;else revT[n]=!revT[n];applyLineState();renderSide();}
  else if(/^[1-4]$/.test(e.key)){setStep(+e.key-1,false);}
});
if("mediaSession" in navigator){
  try{navigator.mediaSession.metadata=new MediaMetadata({title:D.title,artist:D.podcast});}catch(e){}
  try{var ms=navigator.mediaSession;ms.setActionHandler("play",togglePlay);ms.setActionHandler("pause",function(){au.pause();});
    ms.setActionHandler("previoustrack",prev);ms.setActionHandler("nexttrack",next);}catch(e){}
}
function fromHash(){var m=location.hash.match(/(seg|s)=(\d+)/);if(!m)return;var v=+m[2];
  if(m[1]==="seg"){var k=G.findIndex(function(g){return g.n===v;});if(k>=0)goSeg(k);}
  else if(v>=1&&v<=S.length){var i=v-1;if(segOf(i)!==st.seg)goSeg(segOf(i),i);setCur(i);au.currentTime=S[i].a;}}
au.addEventListener("loadedmetadata",function(){au.currentTime=S[st.cur].a;renderTime();},{once:true});

renderTop();renderSteps();renderStage();renderTicks();renderSide();renderCtl();renderTime();
fromHash();addEventListener("hashchange",fromHash);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(center);
})();
</script>
