<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F4F0">
<title>__TITLE__</title>
<style>
:root{
  --bg:#F5F4F0;--surface:#FFFFFF;--ink:#17171B;--ink2:#5E5E68;--ink3:#A2A2AB;--line:#E8E6E0;
  --acc:#0F766E;--acc-soft:#E3F1EE;--acc-ink:#0B5A54;--shadow:0 10px 30px rgba(20,20,30,.08),0 2px 6px rgba(20,20,30,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111113;--surface:#1B1B1F;--ink:#F2F2F4;--ink2:#A7A7B0;--ink3:#6B6B75;--line:#2A2A30;
  --acc:#2DD4BF;--acc-soft:#123430;--acc-ink:#5EEAD4;--shadow:0 10px 30px rgba(0,0,0,.4);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Segoe UI","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
.wrap{max-width:640px;margin:0 auto;padding:20px 20px calc(130px + env(safe-area-inset-bottom))}

/* 头部 */
.pod{font-size:13px;color:var(--ink3);letter-spacing:.01em}
h1{font-size:22px;line-height:1.25;margin:4px 0 0;font-weight:700;letter-spacing:-.01em}
.sub{font-size:15px;color:var(--ink2);margin-top:2px}
.segnav{display:flex;align-items:center;gap:6px;margin:18px 0 14px}
.seglabel{position:relative;flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;padding:10px 14px;border-radius:14px;background:var(--surface)}
.seglabel b{font-size:15px;white-space:nowrap}
.seglabel b em{font-style:normal;font-weight:400;color:var(--ink3)}
.seglabel span{font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seglabel .rt{font-style:normal}
@media (max-width:480px){.seglabel .rt{display:none}}
.seglabel .chev{margin-left:auto;color:var(--ink3);flex:none}
.seglabel select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--surface);display:grid;place-items:center;color:var(--ink2);flex:none}
.iconbtn:disabled{opacity:.35;cursor:default}

/* 四步 */
.stepper{display:flex;align-items:flex-start;margin:4px 0 18px}
.st{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:12px;color:var(--ink3)}
.st:not(:last-child)::after{content:"";position:absolute;top:13px;left:calc(50% + 18px);right:calc(-50% + 18px);height:2px;border-radius:2px;background:var(--line)}
.st.done:not(:last-child)::after{background:var(--acc)}
.st .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--surface);color:var(--ink3);box-shadow:inset 0 0 0 1.5px var(--line);transition:.2s}
.st.done .dot{background:var(--acc);color:#fff;box-shadow:none}
.st.on .dot{background:var(--ink);color:var(--bg);box-shadow:none}
.st.on{color:var(--ink);font-weight:600}

/* 主卡片 */
.card{background:var(--surface);border-radius:24px;padding:22px 22px 20px;box-shadow:var(--shadow);min-height:210px;display:flex;flex-direction:column}
.cap{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink3);margin-bottom:14px}
.cap .hint{color:var(--ink2)}
.src{font-size:25px;line-height:1.42;font-weight:600;letter-spacing:-.012em;margin:0}
.src.m{font-size:21px}.src.l{font-size:18px;line-height:1.5}.src.xl{font-size:16px;line-height:1.55;font-weight:500}
.tgt{font-size:16px;line-height:1.6;color:var(--ink2);margin-top:12px}
.blur{filter:blur(8px);opacity:.75;cursor:pointer;user-select:none;transition:filter .2s,opacity .2s}
.tap{cursor:pointer}
.reveal{font-size:12.5px;color:var(--ink3);margin-top:auto;padding-top:16px}
.blind{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--ink2);font-size:14px}
.bars{display:flex;align-items:center;gap:5px;height:44px}
.bars i{width:5px;border-radius:3px;background:var(--acc);height:10px;opacity:.85}
.playing .bars i{animation:eq 1s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:-.2s}.bars i:nth-child(3){animation-delay:-.45s}.bars i:nth-child(4){animation-delay:-.7s}
.bars i:nth-child(5){animation-delay:-.35s}.bars i:nth-child(6){animation-delay:-.6s}.bars i:nth-child(7){animation-delay:-.1s}
@keyframes eq{0%,100%{height:10px}50%{height:40px}}
mark{background:var(--acc-soft);color:var(--acc-ink);border-radius:4px;padding:0 2px}

/* 自评 */
.rate{display:none;background:var(--surface);border-radius:20px;padding:18px;margin-top:12px;box-shadow:var(--shadow)}
.rate.show{display:block}
.rate p{margin:0 0 12px;font-weight:600}
.rate .opts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rate .opts button{padding:10px 0;border-radius:12px;background:var(--bg);font-size:14px}
.rate .opts button:hover{background:var(--acc-soft);color:var(--acc-ink)}
.rate .cmp{display:flex;align-items:center;gap:10px;font-size:15px;margin-bottom:14px}
.rate .cmp b{font-size:20px}
.rate .go{width:100%;padding:12px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:600}

/* 列表 */
.seg-ctl{display:inline-flex;background:var(--line);border-radius:12px;padding:3px;margin:28px 0 10px}
.seg-ctl button{padding:6px 14px;border-radius:9px;font-size:14px;color:var(--ink2)}
.seg-ctl button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:30px 1fr;gap:4px;padding:11px 12px;border-radius:14px;cursor:pointer}
.list li:hover{background:rgba(127,127,127,.06)}
.list li.cur{background:var(--acc-soft)}
.list .n{font-size:12px;color:var(--ink3);padding-top:3px;font-variant-numeric:tabular-nums}
.list .s{font-size:16px;line-height:1.5}
.list li.cur .s{font-weight:600}
.list .t{font-size:14px;color:var(--ink2);margin-top:2px}
.list .blur{filter:blur(6px)}
.note{padding:14px 12px;border-radius:14px;cursor:pointer}
.note:hover{background:rgba(127,127,127,.06)}
.note .h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.note .e{font-weight:700;font-size:16px}
.note .k{font-size:11.5px;color:var(--acc-ink);background:var(--acc-soft);padding:1px 7px;border-radius:6px}
.note .w{font-size:12px;color:var(--ink3);margin-left:auto}
.note .x{color:var(--ink2);font-size:14px;margin-top:4px}
.empty{color:var(--ink3);padding:20px 12px;font-size:14px}
.foot{font-size:12px;color:var(--ink3);margin-top:22px;text-align:center}
.keys{display:none}
@media (hover:hover) and (min-width:700px){.keys{display:block;margin-top:6px}}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}
.warn{display:none;background:#FDECEC;color:#9B1C1C;padding:12px 14px;border-radius:14px;margin-bottom:14px;font-size:14px}

/* 播放条 */
.bar{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
.bar .in{max-width:616px;margin:0 auto;background:var(--surface);border-radius:24px;box-shadow:0 12px 40px rgba(20,20,30,.16),0 2px 8px rgba(20,20,30,.06);padding:12px 18px 14px;pointer-events:auto}
.time{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 10px}
.prog i{display:block;height:100%;width:0;background:var(--ink);border-radius:4px}
.ctl{display:grid;grid-template-columns:1fr auto auto auto 1fr;align-items:center;gap:18px}
.ctl .speed{justify-self:start;font-size:13px;font-weight:600;padding:6px 10px;border-radius:10px;background:var(--bg);font-variant-numeric:tabular-nums;min-width:52px}
.ctl .skip{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.ctl .skip:active{background:var(--bg)}
.ctl .play{width:58px;height:58px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;transition:transform .1s}
.ctl .play:active{transform:scale(.95)}
.ctl .loop{justify-self:end;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--ink3)}
.ctl .loop.on{color:var(--acc-ink);background:var(--acc-soft)}
@media (max-width:380px){.ctl{gap:10px}.src{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="warn" id="warn"></div>
  <div class="pod" id="pod"></div>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>

  <div class="segnav">
    <button class="iconbtn" id="segPrev" aria-label="prev part"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <label class="seglabel"><b id="segName"></b><span id="segMeta"></span>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      <select id="seg" aria-label="part"></select></label>
    <button class="iconbtn" id="segNext" aria-label="next part"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>

  <div class="stepper" id="steps"></div>
  <div class="card" id="card"></div>
  <div class="rate" id="rate"></div>

  <div class="seg-ctl"><button id="tabS" class="on"></button><button id="tabN"></button></div>
  <div id="panel"></div>
  <div class="foot" id="summary"></div>
</div>

<div class="bar"><div class="in">
  <div class="time"><span id="tNow">0:00</span><span id="tEnd">0:00</span></div>
  <div class="prog"><i id="prog"></i></div>
  <div class="ctl">
    <button class="speed" id="bSpeed" aria-label="speed">1.0×</button>
    <button class="skip" id="bPrev" aria-label="previous line"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="2.4" height="14" rx="1.2"/><path d="M19.5 6.3v11.4a1 1 0 0 1-1.53.85L9.6 13.27a1.5 1.5 0 0 1 0-2.54l8.37-5.28a1 1 0 0 1 1.53.85z"/></svg></button>
    <button class="play" id="bPlay" aria-label="play"></button>
    <button class="skip" id="bNext" aria-label="next line"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="16.6" y="5" width="2.4" height="14" rx="1.2"/><path d="M4.5 6.3v11.4a1 1 0 0 0 1.53.85l8.37-5.28a1.5 1.5 0 0 0 0-2.54L6.03 5.45A1 1 0 0 0 4.5 6.3z"/></svg></button>
    <button class="loop" id="bLoop" aria-label="loop"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.5l3.5 3.5L17 9.5"/><path d="M3.5 11V9.5A3.5 3.5 0 0 1 7 6h13.5"/><path d="M7 21.5L3.5 18 7 14.5"/><path d="M20.5 13v1.5A3.5 3.5 0 0 1 17 18H3.5"/><path d="M11 10.2l1.4-.8v5.4"/></svg></button>
  </div>
</div></div>
<audio id="au" preload="auto"></audio>
<script type="application/json" id="data">__DATA__</script>
<script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById("data").textContent);
var S=D.sentences, G=D.segments, N=D.notes||[];
var UI=(D.target_lang||"zh").indexOf("zh")===0?"zh":"en";
var L={zh:{
  seg:"第 {n} 段",of:"共 {t} 段",steps:["盲听","精听","对照","再盲听"],
  hints:["完整听完这一段，先别看文字","每句播完会停，点模糊处偷看","打开原文和译文，弄懂每一句","再盲听一遍，看看进步了多少"],
  blind:"盲听中，先用耳朵",blindIdle:"点下方 ▶ 开始盲听",tapSrc:"点原文或译文可显示",
  rateQ:"这一段你听懂了几成？",rates:["两成","四成","六成","八成","全懂"],
  first:"第一遍",second:"第二遍",next:"下一段",toStep:"开始精听",
  tabS:"本段句子",tabN:"难点表达",noNotes:"本期还没有难点表达。",
  noAudio:"找不到音频 {p}，请把它和本页面放在同一个文件夹。",
  done:"已完成 {d} / {t} 段",sent:"第 {n} 句",wpm:"{w} 词/分",cpm:"{w} 字/分",
  keys:"<kbd>空格</kbd> 播放 · <kbd>←</kbd> <kbd>→</kbd> 上/下一句 · <kbd>R</kbd> 循环 · <kbd>T</kbd> 显示原文"
},en:{
  seg:"Part {n}",of:"of {t}",steps:["Blind","Drill","Compare","Re-listen"],
  hints:["Listen to the whole part. No reading yet.","Pauses after each line. Tap the blur to peek.","Read the text and translation. Understand every line.","Listen blind again and see how far you got."],
  blind:"Listening blind",blindIdle:"Press ▶ to start",tapSrc:"Tap the text to reveal",
  rateQ:"How much did you understand?",rates:["20%","40%","60%","80%","All"],
  first:"First",second:"Second",next:"Next part",toStep:"Start drilling",
  tabS:"Lines",tabN:"Key phrases",noNotes:"No key phrases yet.",
  noAudio:"Audio {p} not found. Keep it in the same folder as this page.",
  done:"{d} / {t} parts done",sent:"Line {n}",wpm:"{w} wpm",cpm:"{w} chars/min",
  keys:"<kbd>Space</kbd> play · <kbd>←</kbd> <kbd>→</kbd> prev/next · <kbd>R</kbd> loop · <kbd>T</kbd> reveal"
}}[UI];
var ICON_PLAY='<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.7v12.6a1.2 1.2 0 0 0 1.82 1.03l10.2-6.3a1.2 1.2 0 0 0 0-2.06L9.82 4.67A1.2 1.2 0 0 0 8 5.7z"/></svg>';
var ICON_PAUSE='<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></svg>';
var CHECK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function f(s,o){return s.replace(/\{(\w+)\}/g,function(_,k){return o[k]});}
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function mmss(t){t=Math.max(0,Math.floor(t));var h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0");}
function rateText(g){return g.rate?f(D.rate_unit==="cpm"?L.cpm:L.wpm,{w:g.rate}):"";}

var KEY="cherina-lesson:"+D.id;
var st={seg:0,cur:G[0].from,step:0,speed:1,ratings:{},steps:{}};
try{var saved=JSON.parse(localStorage.getItem(KEY)||"null");if(saved)Object.assign(st,saved);}catch(e){}
if(st.seg>=G.length)st.seg=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}

var au=$("au"); au.src=D.audio;
au.addEventListener("error",function(){var w=$("warn");w.textContent=f(L.noAudio,{p:D.audio});w.style.display="block";});
var loop=false, revealS={}, revealT={}, tab="s", raf=0;

var notesBy={};N.forEach(function(x){(notesBy[x.n]=notesBy[x.n]||[]).push(x);});
function hl(text,n){
  var out=esc(text),list=notesBy[n];if(!list||st.step<2)return out;
  list.forEach(function(x){var e=esc(x.expr),i=out.toLowerCase().indexOf(e.toLowerCase());
    if(i>=0)out=out.slice(0,i)+"<mark>"+out.slice(i,i+e.length)+"</mark>"+out.slice(i+e.length);});
  return out;
}
function segOf(i){for(var k=0;k<G.length;k++)if(i>=G[k].from&&i<G[k].to)return k;return G.length-1;}
function findIdx(t){var lo=0,hi=S.length-1;while(lo<hi){var m=(lo+hi+1)>>1;if(S[m].a<=t)lo=m;else hi=m-1;}return lo;}
function blindStep(){return st.step===0||st.step===3;}
function srcShown(n){return st.step===2||!!revealS[n];}
function tgtShown(n){return st.step===2||!!revealT[n];}

// ---------- 渲染 ----------
function renderHeader(){
  $("pod").textContent=D.podcast+(D.podcast_target?" · "+D.podcast_target:"");
  $("title").textContent=D.title;$("sub").textContent=D.title_target||"";
  document.title=D.title;
  var g=G[st.seg];
  $("segName").innerHTML=esc(f(L.seg,{n:g.n}))+'<em> / '+G.length+'</em>';
  $("segMeta").innerHTML=mmss(g.start)+"–"+mmss(g.end)+(g.rate?'<i class="rt"> · '+rateText(g)+"</i>":"");
  var sel=$("seg");
  if(sel.options.length!==G.length){sel.innerHTML="";G.forEach(function(x,k){sel.add(new Option("",k));});}
  G.forEach(function(x,k){sel.options[k].text=f(L.seg,{n:x.n})+"  "+mmss(x.start)+"–"+mmss(x.end)+((st.steps[x.n]||0)>=4?"  ✓":"");});
  sel.value=st.seg;
  $("segPrev").disabled=st.seg===0;$("segNext").disabled=st.seg===G.length-1;
}
function renderSteps(){
  var doneN=st.steps[G[st.seg].n]||0;
  $("steps").innerHTML=L.steps.map(function(s,k){
    var cls="st"+(k===st.step?" on":"")+(k<doneN&&k!==st.step?" done":"");
    return '<button class="'+cls+'" data-k="'+k+'"><span class="dot">'+(k<doneN&&k!==st.step?CHECK:(k+1))+'</span>'+s+'</button>';
  }).join("");
  $("steps").querySelectorAll(".st").forEach(function(b){b.onclick=function(){setStep(+b.dataset.k);};});
}
function renderCard(){
  var s=S[st.cur],c=$("card"),h='<div class="cap"><span class="hint">'+L.hints[st.step]+'</span><span>'+f(L.sent,{n:s.n})+" · "+mmss(s.a)+'</span></div>';
  if(blindStep()){
    h+='<div class="blind'+(au.paused?'':' playing')+'"><div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>'+(au.paused?L.blindIdle:L.blind)+'</div>';
  }else{
    var bs=!srcShown(s.n),bt=!tgtShown(s.n);
    var ln=s.s.length,sz=ln>260?' xl':ln>150?' l':ln>80?' m':'';
    h+='<p class="src'+sz+(bs?' blur':'')+(st.step===1?' tap':'')+'" id="cS">'+hl(s.s,s.n)+'</p>';
    if(s.t)h+='<div class="tgt'+(bt?' blur':'')+(st.step===1?' tap':'')+'" id="cT">'+esc(s.t)+'</div>';
    if(st.step===1&&(bs||bt))h+='<div class="reveal">'+L.tapSrc+'</div>';
  }
  c.innerHTML=h;
  if(st.step===1){
    var cs=$("cS"),ct=$("cT");
    if(cs)cs.onclick=function(){revealS[s.n]=!revealS[s.n];renderCard();renderPanel();};
    if(ct)ct.onclick=function(){revealT[s.n]=!revealT[s.n];renderCard();renderPanel();};
  }
}
function renderPanel(){
  $("tabS").textContent=L.tabS;$("tabN").textContent=L.tabN+(N.length?" "+N.length:"");
  $("tabS").className=tab==="s"?"on":"";$("tabN").className=tab==="n"?"on":"";
  var p=$("panel"),g=G[st.seg];
  if(tab==="s"){
    var h='<ol class="list">';
    for(var i=g.from;i<g.to;i++){var s=S[i];
      var bs=blindStep()||!srcShown(s.n),bt=blindStep()||!tgtShown(s.n);
      h+='<li data-i="'+i+'"'+(i===st.cur?' class="cur"':'')+'><span class="n">'+s.n+'</span><div>'+
        '<div class="s'+(bs?' blur':'')+'">'+hl(s.s,s.n)+'</div>'+
        (s.t&&!(st.step===1&&bt)?'<div class="t'+(bt?' blur':'')+'">'+esc(s.t)+'</div>':'')+'</div></li>';}
    p.innerHTML=h+"</ol>";
    p.querySelectorAll("li").forEach(function(li){li.onclick=function(){playSentence(+li.dataset.i);};});
  }else{
    if(!N.length){p.innerHTML='<div class="empty">'+L.noNotes+'</div>';return;}
    p.innerHTML=N.map(function(x){return '<div class="note" data-n="'+x.n+'"><div class="h"><span class="e">'+esc(x.expr)+'</span>'+
      (x.type?'<span class="k">'+esc(x.type)+'</span>':'')+'<span class="w">#'+x.n+' · '+mmss(S[x.n-1].a)+'</span></div><div class="x">'+esc(x.explain||"")+'</div></div>';}).join("");
    p.querySelectorAll(".note").forEach(function(el){el.onclick=function(){var i=+el.dataset.n-1;goSeg(segOf(i),i);setStep(2,true);playSentence(i);window.scrollTo({top:0,behavior:"smooth"});};});
  }
}
function scrollCur(){var cur=$("panel").querySelector("li.cur");if(!cur)return;var r=cur.getBoundingClientRect();
  if(r.top<0||r.bottom>innerHeight-150)cur.scrollIntoView({block:"center",behavior:"smooth"});}
function renderRate(which){
  var r=$("rate"),g=G[st.seg],rt=st.ratings[g.n]||{};
  if(which==null){r.className="rate";r.innerHTML="";return;}
  var h;
  if(which==="ask1"||which==="ask4"){
    h='<p>'+L.rateQ+'</p><div class="opts">'+L.rates.map(function(x,k){return '<button data-v="'+k+'">'+x+'</button>';}).join("")+'</div>';
  }else{
    var b=which==="after4"?L.rates[rt.r4]:"—";
    h='<div class="cmp"><span>'+L.first+' <b>'+(rt.r1!=null?L.rates[rt.r1]:"—")+'</b></span><span style="color:var(--ink3)">→</span><span>'+L.second+' <b>'+b+'</b></span></div>';
    if(which==="after1")h+='<button class="go" id="go">'+L.toStep+'</button>';
    else if(st.seg<G.length-1)h+='<button class="go" id="go">'+L.next+'</button>';
  }
  r.innerHTML=h;r.className="rate show";
  r.querySelectorAll("[data-v]").forEach(function(b){b.onclick=function(){
    rt[which==="ask1"?"r1":"r4"]=+b.dataset.v;st.ratings[g.n]=rt;markStep(which==="ask1"?1:4);save();
    renderRate(which==="ask1"?"after1":"after4");renderSteps();renderHeader();renderSummary();};});
  var go=$("go");if(go)go.onclick=function(){if(which==="after1")setStep(1,true);else{goSeg(st.seg+1);setStep(0,true);}window.scrollTo({top:0,behavior:"smooth"});};
  r.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function renderSummary(){
  var d=0;G.forEach(function(g){if((st.steps[g.n]||0)>=4)d++;});
  $("summary").innerHTML=f(L.done,{d:d,t:G.length})+'<div class="keys">'+L.keys+'</div>';
}
function renderCtl(){
  $("bPlay").innerHTML=au.paused?ICON_PLAY:ICON_PAUSE;
  $("bLoop").className="loop"+(loop?" on":"");
  $("bSpeed").textContent=String(st.speed)+"×";
  var bl=document.querySelector(".blind");
  if(bl){bl.classList.toggle("playing",!au.paused);bl.lastChild.textContent=au.paused?L.blindIdle:L.blind;}
}
function renderTime(){
  var g=G[st.seg],t=au.currentTime,d=g.end-g.start;
  $("tNow").textContent=mmss(Math.max(0,t-g.start));$("tEnd").textContent=mmss(d);
  $("prog").style.width=(d>0?Math.max(0,Math.min(100,(t-g.start)/d*100)):0)+"%";
}
function renderAll(){renderHeader();renderSteps();renderCard();renderPanel();renderCtl();renderSummary();renderTime();}

// ---------- 状态 ----------
function markStep(k){var n=G[st.seg].n;st.steps[n]=Math.max(st.steps[n]||0,k);}
function setStep(k,quiet){
  st.step=k;loop=false;renderRate(null);save();renderSteps();renderCard();renderPanel();renderCtl();
  if(!quiet&&(k===0||k===3))playSentence(G[st.seg].from);
}
function goSeg(k,i){
  k=Math.max(0,Math.min(G.length-1,k));if(k!==st.seg){au.pause();}
  st.seg=k;st.cur=i!=null?i:G[k].from;revealS={};revealT={};save();
  renderHeader();renderSteps();renderCard();renderPanel();renderRate(null);renderTime();
}
function playSentence(i){
  i=Math.max(0,Math.min(S.length-1,i));
  var k=segOf(i);if(k!==st.seg)goSeg(k,i);
  st.cur=i;save();au.currentTime=S[i].a;au.playbackRate=st.speed;
  var p=au.play();if(p&&p.catch)p.catch(function(){});
  renderCard();renderPanel();scrollCur();
}
function onSegmentEnd(){
  au.pause();
  if(st.step===0)renderRate("ask1");else if(st.step===3)renderRate("ask4");else if(st.step===2){markStep(3);renderSteps();}
  save();
}
function tick(){
  var t=au.currentTime,s=S[st.cur];
  if(t<s.a-0.6||t>s.b+0.6){var j=findIdx(t);if(j!==st.cur){st.cur=j;if(segOf(j)!==st.seg)goSeg(segOf(j),j);renderCard();renderPanel();scrollCur();}}
  else if(t>=s.b-0.03){
    var g=G[st.seg];
    if(loop){au.currentTime=s.a;}
    else if(st.step===1){au.pause();au.currentTime=Math.max(s.a,s.b-0.05);markStep(2);save();renderSteps();}
    else if(st.cur+1>=g.to){onSegmentEnd();}
    else if(st.cur+1<S.length){st.cur++;save();renderCard();renderPanel();scrollCur();}
  }
  renderTime();
  if(!au.paused)raf=requestAnimationFrame(tick);
}
au.addEventListener("play",function(){cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);renderCtl();});
au.addEventListener("pause",renderCtl);

function togglePlay(){
  if(!au.paused){au.pause();return;}
  var s=S[st.cur],t=au.currentTime;
  if(t<s.a-0.05||t>=s.b-0.08)au.currentTime=s.a;
  renderRate(null);au.playbackRate=st.speed;var p=au.play();if(p&&p.catch)p.catch(function(){});
}
function next(){playSentence(st.cur+1);}
function prev(){playSentence(st.cur-1);}
$("bPlay").onclick=togglePlay;$("bNext").onclick=next;$("bPrev").onclick=prev;
$("bLoop").onclick=function(){loop=!loop;renderCtl();};
$("bSpeed").onclick=function(){var v=[0.75,0.9,1,1.25];st.speed=v[(v.indexOf(st.speed)+1)%v.length];au.playbackRate=st.speed;save();renderCtl();};
$("seg").onchange=function(){goSeg(+this.value);setStep(0,true);};
$("segPrev").onclick=function(){goSeg(st.seg-1);setStep(0,true);};
$("segNext").onclick=function(){goSeg(st.seg+1);setStep(0,true);};
$("tabS").onclick=function(){tab="s";renderPanel();};$("tabN").onclick=function(){tab="n";renderPanel();};
document.addEventListener("keydown",function(e){
  if(e.target.tagName==="SELECT"||e.metaKey||e.ctrlKey)return;
  if(e.key===" "){e.preventDefault();togglePlay();}
  else if(e.key==="ArrowRight"){e.preventDefault();next();}else if(e.key==="ArrowLeft"){e.preventDefault();prev();}
  else if(e.key==="r"||e.key==="R"){loop=!loop;renderCtl();}
  else if((e.key==="t"||e.key==="T")&&st.step===1){var n=S[st.cur].n;revealS[n]=!revealS[n];renderCard();renderPanel();}
});
if("mediaSession" in navigator){
  try{navigator.mediaSession.metadata=new MediaMetadata({title:D.title,artist:D.podcast});}catch(e){}
  var ms=navigator.mediaSession;
  try{ms.setActionHandler("play",togglePlay);ms.setActionHandler("pause",function(){au.pause();});
    ms.setActionHandler("previoustrack",prev);ms.setActionHandler("nexttrack",next);}catch(e){}
}
function fromHash(){var m=location.hash.match(/(seg|s)=(\d+)/);if(!m)return;var v=+m[2];
  if(m[1]==="seg"){var k=G.findIndex(function(g){return g.n===v;});if(k>=0){goSeg(k);setStep(0,true);}}
  else if(v>=1&&v<=S.length){var i=v-1;goSeg(segOf(i),i);}}
fromHash();window.addEventListener("hashchange",fromHash);
au.addEventListener("loadedmetadata",function(){au.currentTime=S[st.cur].a;renderTime();},{once:true});
renderAll();
})();
</script>
</body>
</html>
