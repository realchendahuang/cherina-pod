name = "cherina-pod"
main = "src/index.js"
compatibility_date = "2024-12-01"
workers_dev = true

# 自定义域名（cherina.app 托管在 Cloudflare，主域名被 cherina-app 占用，用子域名）
routes = [
  { pattern = "pod.cherina.app", custom_domain = true }
]

# 静态资源：public/ 下的文件直接由 Cloudflare 边缘缓存分发
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"

[observability]
enabled = true
