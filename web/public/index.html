  /* ================= 频道页 ================= */
  .pod-hero {
    display: flex; gap: var(--app-space-6);
    align-items: flex-start;
    margin-bottom: var(--app-space-8);
  }
  .pod-cover-wrap {
    width: 180px; height: 180px;
    flex-shrink: 0;
    border-radius: var(--app-radius-xl);
    background: var(--app-surface-warm);
    box-shadow: var(--app-shadow-floating);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .pod-cover-wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .pod-cover-wrap .cover-ph { font-size: var(--app-text-hero); }
  .pod-info { min-width: 0; flex: 1; }
  .pod-info h1 {
    font-size: var(--app-text-h1);
    line-height: 1.25;
    font-weight: 800;
    letter-spacing: .2px;
  }
  .pod-info .author {
    font-size: var(--app-text-body-sm);
    color: var(--app-text-muted);
    margin-top: var(--app-space-1);
  }
  .desc-toggle {
    font-size: var(--app-text-caption);
    font-weight: 700;
    color: var(--app-action-accent);
    padding: 2px 0;
    margin-top: 2px;
  }
  .desc-toggle:hover { text-decoration: underline; }
  .pod-stats {
    font-size: var(--app-text-body-sm);
    color: var(--app-text-muted);
    font-weight: 700;
    margin-top: var(--app-space-3);
    font-variant-numeric: tabular-nums;
  }

  /* 单集行 */
  .ep-rows {
    background: var(--app-card);
    border: 1px solid var(--app-border-muted);
    border-radius: var(--app-radius-xl);
    box-shadow: var(--app-shadow-xs);
    overflow: hidden;
  }
  .ep-row {
    display: flex; align-items: center; gap: var(--app-space-4);
    padding: var(--app-space-3) var(--app-space-4);
    cursor: pointer;
    border-bottom: 1px solid var(--app-border-muted);
    transition: background var(--app-duration-base) var(--app-ease-standard);
  }
  .ep-row:last-child { border-bottom: none; }
  .ep-row:hover { background: var(--app-selection-surface); }
  .ep-row .num {
    width: 1.75rem;
    flex-shrink: 0;
    text-align: right;
    font-size: var(--app-text-body-sm);
    font-weight: 700;
    color: var(--app-text-disabled);
    font-variant-numeric: tabular-nums;
  }
  .ep-row .thumb-wrap {
    width: 56px; height: 56px;
    flex-shrink: 0;
    border-radius: var(--app-radius-md);
    background: var(--app-surface-warm);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--app-shadow-xs);
  }
  .ep-row .thumb-wrap .cover-ph { font-size: var(--app-text-h3); }
  .ep-row .thumb { width: 100%; height: 100%; object-fit: cover; }
  .ep-row .info { min-width: 0; flex: 1; }
  .ep-row .t-zh {
    font-size: var(--app-text-body-sm);
    font-weight: 700;
    font-family: var(--font-brand-reading);
    line-height: 1.45;
  }
  .ep-row .t-en {
    font-size: var(--app-text-caption);
    color: var(--app-text-muted);
    line-height: 17px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ep-row .meta {
    font-size: var(--app-text-caption);
    color: var(--app-text-muted);
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }
  /* 句子命中行：中文句较长，允许多行而非截断；时间戳更醒目 */
  .sent-hits .ep-row .num { color: var(--app-action-accent); width: auto; min-width: 2.5rem; }
  .sent-hits .ep-row .t-zh { white-space: normal; }
  .sent-hits .ep-row .t-en { white-space: normal; }
  /* 收听进度：细朱砂条 + 已听至 */
  .ep-row .heard {
    display: flex; align-items: center; gap: var(--app-space-2);
    margin-top: 6px;
  }
  .mini-progress {
    width: 96px; height: 3px;
    border-radius: var(--app-radius-pill);
    background: var(--app-surface-soft);
    overflow: hidden;
    flex-shrink: 0;
  }
  .mini-progress > span {
    display: block; height: 100%;
    border-radius: var(--app-radius-pill);
    background: var(--app-selection-accent);
  }
  .ep-row .heard .heard-text {
    font-size: var(--app-text-micro);
    color: var(--app-selection-accent);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .ep-row .chev { flex-shrink: 0; color: var(--app-text-disabled); transition: color var(--app-duration-base) var(--app-ease-standard); }
  .ep-row:hover .chev { color: var(--app-action-accent); }
  .ep-row .chev svg { width: var(--app-icon-sm); height: var(--app-icon-sm); }

  /* ================= 详情页：Hero（封面 + 标题区） ================= */
  .ep-hero {
    display: flex; gap: var(--app-space-5);
    align-items: flex-start;
    margin-bottom: var(--app-space-6);
  }
  .ep-hero-cover {
    width: 128px; height: 128px;
    flex-shrink: 0;
    border-radius: var(--app-radius-xl);
    background: var(--app-surface-warm);
    box-shadow: var(--app-shadow-floating);
    overflow: hidden;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .ep-hero-cover .cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .ep-hero-cover .cover-ph { font-size: var(--app-text-display); }
  .ep-head { min-width: 0; flex: 1; }
  .ep-head .pc-name {
    font-size: var(--app-text-caption);
    font-weight: 700;
    color: var(--app-identity-accent);
    letter-spacing: .6px;
  }
  .ep-head h1 {
    font-family: var(--font-brand-display);
    font-size: var(--app-text-h2);
    line-height: 32px;
    letter-spacing: 0;
    margin: var(--app-space-1) 0 var(--app-space-2);
  }
  .ep-head .meta {
    font-size: var(--app-text-caption);
    color: var(--app-text-muted);
    font-variant-numeric: tabular-nums;
  }

  /* ================= 详情页：单列布局 =================
     桌面端整页（Hero + 简介 + 工具条 + 双语列表）收进 48rem 阅读列居中，
     保证 Hero 与下方中英对照区左右对齐；移动端自然全宽。 */
  .ep-layout { display: block; }
  @media (min-width: 1024px) {
    .ep-layout {
      display: grid;
      grid-template-columns: minmax(0, var(--app-container-reading));
      justify-content: center;
      align-items: start;
    }
  }
  /* 单集简介：主列头部，默认 2 行折叠 */
  .ep-desc-wrap { margin-bottom: var(--app-space-5); }
  .ep-desc {
    font-size: var(--app-text-body-sm);
    color: var(--app-text-secondary);
    line-height: 1.75;
    white-space: pre-line;
  }
  .ep-desc.clamped {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ================= 学习工具条（sticky 吸顶：长句列表中随时可切字幕/设置） ================= */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex; align-items: center; gap: var(--app-space-3);
    margin: 0 calc(-1 * var(--app-space-3)) var(--app-space-4);
    padding: var(--app-space-2) var(--app-space-3);
    background: var(--app-sticky-bg);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border-radius: var(--app-radius-md);
  }
  /* 字幕分段控件：当前模式一眼可见、一键直达 */
  .seg {
    display: inline-flex;
    gap: 2px;
    padding: 3px;
    background: var(--app-control-track-bg);
    border: 1px solid var(--app-border);
    border-radius: var(--app-radius-sm-plus);
  }
  .seg-btn {
    padding: 5px var(--app-space-3);
    font-size: var(--app-text-caption);
    font-weight: 700;
    color: var(--app-text-secondary);
    border-radius: var(--app-radius-sm);
    transition: color var(--app-duration-base) var(--app-ease-standard),
                background var(--app-duration-base) var(--app-ease-standard),
                transform var(--app-duration-base) var(--app-ease-standard);
  }
  .seg-btn.on {
    background: var(--app-control-thumb-bg);
    color: var(--app-selection-accent);
    box-shadow: var(--app-control-thumb-shadow);
  }
  .tool-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px var(--app-space-3);
    font-size: var(--app-text-body-sm);
    border-radius: var(--app-radius-sm-plus);
    color: var(--app-text-secondary);
    border: 1px solid var(--app-border);
    background: var(--app-card);
    transition: color var(--app-duration-base) var(--app-ease-standard),
                border-color var(--app-duration-base) var(--app-ease-standard),
                background var(--app-duration-base) var(--app-ease-standard),
                transform var(--app-duration-base) var(--app-ease-standard);
  }
  .tool-btn:hover { color: var(--app-action-accent); border-color: var(--app-border-active); }
  .tool-btn.on {
    color: var(--app-selection-accent);
    border-color: var(--app-border-active);
    background: var(--app-selection-surface);
    font-weight: 700;
  }
  .tool-btn svg { width: var(--app-icon-xs); height: var(--app-icon-xs); }
  /* 工具条方形图标按钮（跟随 / 快捷键 / 字号等） */
  .tbtn {
    width: 38px; height: 38px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--app-radius-sm-plus);
    border: 1px solid var(--app-border);
    background: var(--app-card);
    color: var(--app-text-secondary);
    transition: color var(--app-duration-base) var(--app-ease-standard),
                border-color var(--app-duration-base) var(--app-ease-standard),
                background var(--app-duration-base) var(--app-ease-standard),
                transform var(--app-duration-base) var(--app-ease-standard);
  }
  .tbtn:hover { background: var(--app-surface-warm); color: var(--app-text-primary); }
  .tbtn.on {
    color: var(--app-selection-accent);
    border-color: var(--app-border-active);
    background: var(--app-selection-surface);
  }
  .tbtn svg { width: var(--app-icon-md); height: var(--app-icon-md); }

  /* 设置 popover（渐进披露：跟随 / 字号 / 快捷键收进面板） */
  .settings-wrap { position: relative; }
  .settings-pop {
    position: absolute;
    right: 0; top: calc(100% + var(--app-space-2));
    width: 15.5rem;
    background: var(--app-card);
    border: 1px solid var(--app-border-muted);
    border-radius: var(--app-radius-lg);
    box-shadow: var(--app-shadow-floating);
    padding: var(--app-space-2);
    z-index: 30;
  }
  .set-row {
    display: flex; align-items: center; gap: var(--app-space-2);
    padding: var(--app-space-2);
    border-radius: var(--app-radius-sm);
  }
  .set-label {
    flex: 1;
    font-size: var(--app-text-body-sm);
    font-weight: 600;
    color: var(--app-text-primary);
  }
  .set-hint {
    font-size: var(--app-text-micro);
    color: var(--app-text-disabled);
    font-variant-numeric: tabular-nums;
  }
  /* 开关 */
  .switch {
    position: relative;
    width: 40px; height: 24px;
    flex-shrink: 0;
    border-radius: var(--app-radius-pill);
    background: var(--app-control-track-bg);
    border: 1px solid var(--app-border);
    transition: background var(--app-duration-base) var(--app-ease-standard),
                border-color var(--app-duration-base) var(--app-ease-standard);
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 18px; height: 18px;
    border-radius: var(--app-radius-pill);
    background: var(--app-control-thumb-bg);
    border: 1px solid var(--app-control-thumb-border);
    box-shadow: var(--app-control-thumb-shadow);
    transition: left var(--app-duration-base) var(--app-ease-standard),
                background var(--app-duration-base) var(--app-ease-standard);
  }
  .switch.on { background: var(--app-selection-surface); border-color: var(--app-border-active); }
  .switch.on::after { left: 18px; background: var(--app-selection-accent); border-color: transparent; }
  /* 字号步进 */
  .set-stepper { display: flex; align-items: center; gap: var(--app-space-2); }
  .set-stepper .tbtn { width: 32px; height: 32px; }
  .set-stepper .tbtn svg { width: var(--app-icon-sm); height: var(--app-icon-sm); }
  .set-val {
    min-width: 2.25rem;
    text-align: center;
    font-size: var(--app-text-body-sm);
    font-weight: 700;
    color: var(--app-text-secondary);
    font-variant-numeric: tabular-nums;
  }
  /* popover 入口行 */
  .set-link {
    display: flex; align-items: center; gap: var(--app-space-2);
    width: 100%;
    padding: var(--app-space-2);
    border-radius: var(--app-radius-sm);
    font-size: var(--app-text-body-sm);
    font-weight: 600;
    color: var(--app-text-secondary);
    transition: background var(--app-duration-base) var(--app-ease-standard),
                color var(--app-duration-base) var(--app-ease-standard),
                transform var(--app-duration-base) var(--app-ease-standard);
  }
  .set-link:hover { background: var(--app-surface-warm); color: var(--app-text-primary); }
  .set-link svg { width: var(--app-icon-sm); height: var(--app-icon-sm); }
  .set-link .set-hint { margin-left: auto; }

  /* ================= 句子列表 ================= */
  .list { display: flex; flex-direction: column; gap: var(--app-space-3); }
  .pair {
    background: var(--app-card);
    border: 1px solid var(--app-border-muted);
    border-radius: var(--app-radius-lg);
    padding: var(--app-space-3) var(--app-space-4) var(--app-space-4);
    cursor: pointer;
    box-shadow: var(--app-shadow-xs);
    position: relative;
    transition: background var(--app-duration-base) var(--app-ease-standard),
                border-color var(--app-duration-base) var(--app-ease-standard),
                box-shadow var(--app-duration-base) var(--app-ease-standard);
  }
  .pair:hover { border-color: var(--app-border-strong); }
  /* 当前句：selection 底 + 左侧朱砂指示条 */
  .pair.active {
    background: var(--app-selection-surface);
    border-color: var(--app-border-active);
  }
  /* 朱砂指示条常驻、active 时淡入，切换不生硬 */
  .pair::before {
    content: "";
    position: absolute;
    left: 0; top: var(--app-space-3); bottom: var(--app-space-3);
    width: 3px;
    border-radius: 0 var(--app-radius-pill) var(--app-radius-pill) 0;
    background: var(--app-selection-accent);
    opacity: 0;
    transition: opacity var(--app-duration-base) var(--app-ease-standard);
  }
  .pair.active::before { opacity: 1; }
  .pair.looping .time::after {
    content: " · 循环中";
    color: var(--app-selection-accent);
    font-weight: 700;
  }
  .pair .time {
    display: inline-block;
    font-size: var(--app-text-micro);
    color: var(--app-text-muted);
    margin-bottom: var(--app-space-1);
    font-variant-numeric: tabular-nums;
    letter-spacing: .3px;
  }
  .pair.active .time { color: var(--app-selection-accent); font-weight: 700; }
  .pair .en {
    font-size: calc(16.5px * var(--pair-scale));
    line-height: 1.65;
    color: var(--app-text-primary);
  }
  .pair .zh {
    font-family: var(--font-brand-reading);
    font-size: calc(14.5px * var(--pair-scale));
    line-height: 1.7;
    color: var(--app-text-secondary);
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed var(--app-border);
  }
  /* 句上 hover 操作：循环此句 / 复制英文 */
  .pair-actions {
    position: absolute;
    top: var(--app-space-2); right: var(--app-space-2);
    display: flex; gap: 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--app-duration-fast) var(--app-ease-standard);
  }
  .pair:hover .pair-actions,
  .pair:focus-within .pair-actions { opacity: 1; pointer-events: auto; }
  /* 触屏无 hover：只在当前句上显示操作，避免满屏浮动按钮干扰阅读 */
  @media (hover: none) {
    .pair.active .pair-actions { opacity: .95; pointer-events: auto; }
  }
  .pa-btn {
    width: 28px; height: 28px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--app-radius-sm);
    border: 1px solid var(--app-border);
    background: var(--app-card);
    color: var(--app-text-muted);
    box-shadow: var(--app-shadow-xs);
    transition: color var(--app-duration-base) var(--app-ease-standard),
                border-color var(--app-duration-base) var(--app-ease-standard),
                transform var(--app-duration-base) var(--app-ease-standard);
  }
  .pa-btn:hover { color: var(--app-action-accent); border-color: var(--app-border-active); }
  .pa-btn.on { color: var(--app-selection-accent); border-color: var(--app-border-active); background: var(--app-selection-surface); }
  .pa-btn svg { width: var(--app-icon-xs); height: var(--app-icon-xs); }
  /* 显示模式 */
  #app.mode-en .pair .zh { display: none; }
  #app.mode-zh .pair .en { display: none; }
  #app.mode-zh .pair .zh { margin-top: 0; padding-top: 0; border-top: none; }

  /* ================= 吸底播放条 ================= */
  .playbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 40;
    background: color-mix(in oklab, var(--app-card) 90%, transparent);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-top: 1px solid var(--app-border-muted);
    box-shadow: 0 -8px 30px rgba(24,20,17,0.08);
    padding-bottom: env(safe-area-inset-bottom);
  }
  html[data-theme="dark"] .playbar { box-shadow: 0 -10px 30px rgba(0,0,0,0.4); }
  /* 顶边全局进度细线（可点击/拖拽） */
  .playbar .pbar-hit {
    position: absolute;
    top: -7px; left: 0; right: 0;
    height: 14px;
    cursor: pointer;
    touch-action: none;
  }
  .playbar .pbar {
    position: absolute;
    top: 6px; left: 0; right: 0;
    height: 2px;
    background: var(--app-border-muted);
    transition: height var(--app-duration-fast) var(--app-ease-standard);
  }
  .playbar .pbar-hit:hover .pbar,
  .playbar .pbar-hit.seeking .pbar { height: 4px; top: 5px; }
  .playbar .pbar-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 0%;
    background: var(--app-selection-accent);
  }
  .playbar-row {
    display: flex; align-items: center; gap: var(--app-space-3);
    max-width: var(--app-container-wide);
    margin: 0 auto;
    padding: var(--app-space-2) var(--app-space-5);
    min-height: 60px;
  }
  .pb-cover-wrap {
    width: 44px; height: 44px;
    flex-shrink: 0;
    border-radius: var(--app-radius-sm-plus);
    background: var(--app-surface-warm);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .pb-cover-wrap .cover-ph { font-size: var(--app-text-h3); }
  .pb-cover { width: 100%; height: 100%; object-fit: cover; }
  .pb-now { min-width: 0; width: 15rem; flex-shrink: 1; }
  .pb-now .np-line {
    font-size: var(--app-text-caption);
    font-weight: 700;
    line-height: 1.4;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pb-now .np-sub {
    font-size: var(--app-text-micro);
    color: var(--app-text-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .p-btn {
    width: var(--app-control-sm); height: var(--app-control-sm);
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--app-radius-pill);
    color: var(--app-text-secondary);
    transition: background var(--app-duration-base) var(--app-ease-standard),
                color var(--app-duration-base) var(--app-ease-standard),
                transform var(--app-duration-base) var(--app-ease-standard);
    flex-shrink: 0;
  }
  .p-btn:hover { background: var(--app-surface-warm); color: var(--app-text-primary); }
  .p-btn svg { width: var(--app-icon-md); height: var(--app-icon-md); }
  .p-btn.main {
    width: var(--app-control-md); height: var(--app-control-md);
    background: var(--app-action-accent);
    color: var(--app-text-inverse);
    box-shadow: 0 4px 12px color-mix(in oklab, var(--app-action-accent) 28%, transparent);
  }
  .p-btn.main:hover { background: var(--app-action-accent); filter: brightness(1.06); color: var(--app-text-inverse); }
  .p-btn.main svg { width: var(--app-icon-lg); height: var(--app-icon-lg); }
  .p-btn.on { color: var(--app-selection-accent); background: var(--app-selection-surface); }
  .times {
    font-size: var(--app-text-caption);
    color: var(--app-text-secondary);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .times .cur { color: var(--app-text-primary); font-weight: 700; }
  .vol-wrap { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .vol-wrap svg { width: var(--app-icon-sm); height: var(--app-icon-sm); color: var(--app-text-muted); }
  .vol-range {
    -webkit-appearance: none;
    appearance: none;
    width: 72px; height: 4px;
    border-radius: var(--app-radius-pill);
    background: var(--app-surface-soft);
    outline: none;
    cursor: pointer;
  }
  .vol-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: var(--app-radius-pill);
    background: var(--app-action-accent);
  }
  .vol-range::-moz-range-thumb {
    width: 12px; height: 12px; border: none;
    border-radius: var(--app-radius-pill);
    background: var(--app-action-accent);
  }
  /* 倍速循环键 */
  .speed-btn {
    min-width: 46px;
    height: 30px;
    padding: 0 var(--app-space-2);
    border-radius: var(--app-radius-sm);
    font-size: var(--app-text-caption);
    font-weight: 800;
    color: var(--app-text-secondary);
    border: 1px solid var(--app-border);
    background: var(--app-card);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
    transition: color var(--app-duration-base) var(--app-ease-standard),
                border-color var(--app-duration-base) var(--app-ease-standard),
                transform var(--app-duration-base) var(--app-ease-standard);
  }
  .speed-btn:hover { color: var(--app-action-accent); border-color: var(--app-border-active); }
  .speed-btn:not(.is-one) { color: var(--app-action-accent); border-color: var(--app-border-active); }
  /* 倍速档位 popover（播放条在底部，向上弹出） */
  .speed-wrap { position: relative; }
  .speed-pop {
    top: auto;
    bottom: calc(100% + var(--app-space-2));
    width: 7.5rem;
  }
  .speed-opt { justify-content: center; }
  .speed-opt.on {
    color: var(--app-selection-accent);
    background: var(--app-selection-surface);
    font-weight: 800;
  }

  /* ================= 空状态：吉祥物陪伴 ================= */
  .empty {
    text-align: center;
    padding: var(--app-space-16) var(--app-space-5);
    color: var(--app-text-muted);
    font-size: var(--app-text-body-sm);
  }
  .empty .mascot {
    width: 120px; height: auto;
    margin: 0 auto var(--app-space-4);
    opacity: .9;
  }
  .empty .empty-detail {
    display: block;
    margin-top: var(--app-space-1);
    font-size: var(--app-text-micro);
    color: var(--app-text-disabled);
  }

  /* ================= 浮动提示 ================= */
  .toast {
    position: fixed;
    left: 50%; bottom: calc(6rem + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(8px);
    background: var(--app-text-primary);
    color: var(--app-page-bg);
    font-size: var(--app-text-body-sm);
    padding: 7px var(--app-space-4);
    border-radius: var(--app-radius-pill);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--app-duration-base) var(--app-ease-standard),
                transform var(--app-duration-base) var(--app-ease-standard);
    z-index: 60;
  }
  .toast.show { opacity: .94; transform: translateX(-50%) translateY(0); }

  /* ================= 快捷键说明弹层 ================= */
  .modal-mask {
    position: fixed; inset: 0;
    background: var(--app-mask-bg);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center; justify-content: center;
    z-index: 50;
    padding: var(--app-space-5);
  }
  .modal-mask.open { display: flex; }
  .modal {
    background: var(--app-card);
    border: 1px solid var(--app-border-muted);
    border-radius: var(--app-radius-2xl);
    box-shadow: var(--app-shadow-floating);
    padding: var(--app-space-6) var(--app-space-7);
    max-width: 380px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal h3 { font-size: var(--app-text-h3); line-height: 26px; margin-bottom: var(--app-space-3); }
  .modal table { width: 100%; border-collapse: collapse; }
  .modal td {
    padding: 7px 0;
    font-size: var(--app-text-body-sm);
    color: var(--app-text-secondary);
    border-bottom: 1px solid var(--app-border-muted);
  }
  .modal tr:last-child td { border-bottom: none; }
  .modal td:first-child { width: 110px; }
  kbd {
    display: inline-block;
    font-family: inherit;
    font-size: var(--app-text-micro);
    color: var(--app-text-primary);
    background: var(--app-surface-warm);
    border: 1px solid var(--app-border);
    border-bottom-width: 2px;
    border-radius: var(--app-radius-xs);
    padding: 1px 7px;
    margin-right: 4px;
  }
  .modal .close-row { text-align: right; margin-top: var(--app-space-4); }
  .modal .close-btn {
    padding: 7px var(--app-space-5);
    font-size: var(--app-text-body-sm);
    font-weight: 700;
    border-radius: var(--app-radius-sm-plus);
    background: var(--app-action-accent);
    color: var(--app-text-inverse);
    transition: filter var(--app-duration-base) var(--app-ease-standard),
                transform var(--app-duration-base) var(--app-ease-standard);
  }
  .modal .close-btn:hover { filter: brightness(1.06); }

  /* ================= 响应式 ================= */
  @media (max-width: 900px) {
    .pb-now { display: none; }
  }
  /* 超窄屏：播放条去掉时间文本，避免按钮溢出（进度仍可见于顶边细线） */
  @media (max-width: 420px) {
    .playbar-row { gap: 6px; }
    .times { display: none; }
  }
  @media (max-width: 640px) {
    .container { padding: var(--app-space-4) var(--app-space-3) var(--app-space-10); }
    .container.has-playbar { padding-bottom: calc(6.5rem + env(safe-area-inset-bottom)); }
    .brand-logo { height: 34px; }
    .search-input { height: var(--app-control-lg); }
    .chan-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: var(--app-space-4) var(--app-space-3); }
    .pod-hero { gap: var(--app-space-4); }
    .pod-cover-wrap { width: 108px; height: 108px; border-radius: var(--app-radius-lg); }
    .pod-info h1 { font-size: var(--app-text-h2); line-height: 1.3; }
    .ep-hero { gap: var(--app-space-4); }
    .ep-hero-cover { width: 76px; height: 76px; border-radius: var(--app-radius-lg); }
    .ep-head h1 { font-size: var(--app-text-h3); line-height: 26px; }
    .ep-row { gap: var(--app-space-3); padding: var(--app-space-3); }
    .ep-row .num { display: none; }
    .ep-row .thumb-wrap { width: 48px; height: 48px; }
    .vol-wrap { display: none; }
    .playbar-row { padding: var(--app-space-2) var(--app-space-3); gap: var(--app-space-2); }
    .times { font-size: var(--app-text-micro); }
    .pair { padding: var(--app-space-3) var(--app-space-3) var(--app-space-3); }
    .pair .en { font-size: calc(15.5px * var(--pair-scale)); }
    .seg-btn { padding: 5px 10px; }
    .mini-card { width: 152px; }
  }
</style>
</head>
<body>
<div class="container" id="container">
  <div class="topbar">
    <a class="brand" id="brandHome" href="#/" aria-label="返回发现首页">
      <img class="brand-logo" src="./brand/web-logo-small.svg" alt="Cherina 吉祥物">
      <span class="brand-name">Cherina Pod</span>
    </a>
    <div class="spacer"></div>
    <button class="icon-btn" id="installBtn" title="安装到主屏幕" aria-label="安装到主屏幕" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M12 6.5V13"/><path d="M9 10l3 3 3-3"/><path d="M9 18.5h6"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" title="切换亮色 / 暗色主题" aria-label="切换主题">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.5 1.5M17.3 17.3l1.5 1.5M5.2 18.8l1.5-1.5M17.3 6.7l1.5-1.5"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
    </button>
  </div>
  <div id="app">
    <div class="empty">加载中…</div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="modal-mask" id="shortcutModal">
  <div class="modal">
    <h3>键盘快捷键</h3>
    <table>
      <tr><td><kbd>空格</kbd></td><td>播放 / 暂停</td></tr>
      <tr><td><kbd>←</kbd><kbd>→</kbd></td><td>上一句 / 下一句</td></tr>
      <tr><td><kbd>↑</kbd><kbd>↓</kbd></td><td>音量加 / 减</td></tr>
      <tr><td><kbd>L</kbd></td><td>当前句单句循环（跟读练习）</td></tr>
      <tr><td><kbd>F</kbd></td><td>跟随滚动开关</td></tr>
      <tr><td><kbd>?</kbd></td><td>打开 / 关闭本说明</td></tr>
      <tr><td><kbd>Esc</kbd></td><td>返回上一级 / 关闭弹层</td></tr>
    </table>
    <div class="close-row"><button class="close-btn" id="modalClose">知道了</button></div>
  </div>
</div>

<script src="./app.js" defer></script>
</body>
</html>
